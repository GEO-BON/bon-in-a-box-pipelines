name: Translate pipelines

# Machine-translates pipeline .json and .md files into pipelines/.<lang>/
# and commits the result to the PR branch. Only new or changed text is sent
# to LibreTranslate (see .github/translation/translate.py).

on:
  pull_request:
    branches: [edge]
    paths:
      - 'pipelines/**.json'
      - 'pipelines/**.md'
      - '!pipelines/.*/**'
      - 'translation.config.yml'
      - '.github/translation/**'
      - '.github/workflows/translate.yml'

concurrency:
  group: translate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Skip PRs from forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::PR from a fork, translations not generated. A maintainer can run translate.py and push."

      - uses: actions/checkout@v6
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/translation/requirements.txt

      - name: Translate
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          LIBRETRANSLATE_API_KEY: ${{ secrets.LIBRETRANSLATE_API_KEY }}
        run: |
          pip install -r .github/translation/requirements.txt
          python .github/translation/translate.py

      - name: Commit translations
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add pipelines/.[a-z][a-z]
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update translations"
          git push
