# Machine translation settings for pipeline .json and .md files.
# Translations are written to .translation/<lang>/<same path as source>.

source: en
languages: [fr]
include:
  - "pipelines/**/*.json"
  - "pipelines/**/*.md"

# Glossary rules, per target language:
#   - no `translations` key       -> term is never translated
#   - language listed             -> term is replaced with that exact text
#   - `translations` without lang -> term is translated by LibreTranslate
# Matching is case-insensitive, on whole words. Longer terms win.
glossary:
  - term: BON in a Box
  - term: GEO BON
  - term: STAC
  - term: GBIF
