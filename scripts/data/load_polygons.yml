script: load_polygons.R
name: Load country, region, WDPCA or EEZ polygons
lifecycle:
  status: core
description: |
 Load polygons stored as geoparquet files. Load polygons for countries or regions, polygons from the World Database of Protected Areas,
 or polygons of Exclusive Economic Zones (EEZs). This script utilizes remote files stored as Geoparquet.
author:
  - name: Jory Griffith
    email: jory.griffith@mcgill.ca
    identifier: https://orcid.org/0000-0001-6020-6690
inputs:
  polygon_type:
    label: Polygon type
    description: Type of polygon to load. Country or region polygons, World database of Protected and Conserved Areas (WDPCA), Exclusive Economic Zones (EEZs), or a custom polygon of a bounding box.
    type: options
    options:
      - Country or region
      - WDPCA
      - EEZ
      - Polygon of bounding box
    example: Country or region
  country_region_bbox:
    label: Country, region, or bounding box
    description: Use the chooser to select a country/ region or create a custom bounding box (region selections will be ignored for EEZs since they are national).
    type: bboxCRS
    example:
  clip_to_location:
    label: Clip to country or region
    description: For WDPCA, clip protected areas within the bounding box to the perimeter of the country or region selected. Note that a country or region must be selected for this option to work.
    type: boolean
    example:
  buffer:
    label: Transboundary buffer
    description: Buffer for pulling transboundary protected areas (WDPCA data only).
      The buffer will pull protected areas within that distance of the country border or bounding box in the unit of the coordinate reference system (meters or degrees).
      If pulling WDPCA data with a custom bounding box, the buffer will not be applied.
    type: float
    example: 0
outputs:
  polygon:
    label: Polygon
    description: Polygons of the country, WDPCA, EEZs for the country or region of interest
    type: application/geopackage+sqlite3
  bbox_crs:
    label: Bounding box and crs of polygon
    description: Bounding box and coordinate reference system of output polygon
    type: bboxCRS
conda:
  channels:
    - conda-forge
  dependencies:
    - r-rjson
    - r-duckdb=1.5.5
    - r-sf=1.1-0