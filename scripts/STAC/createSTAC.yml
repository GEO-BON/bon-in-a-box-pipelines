script: createSTAC.py
name: STAC Collection to Catalog
description: Converts STAC collection(s) into a STAC catalog. A STAC catalog is an aggregation of STAC collections.
author:
  - name: Laetitia Tremblay
    email: laetitia.tremblay@mcgill.ca
lifecycle:
  status: core
inputs:
  stac_collections:
    label: STAC collections
    description: Input STAC collection(s) to convert to a STAC catalog. Can be a single collection or a list of collections.
    type: application/json[]
    example: null
  stac_name:
    label: STAC Name
    description: Name of the STAC catalog to be created, using lowercase letters and hyphens only. Default is "biab-stac".
    type: text
    example: biab-stac
outputs:
  stac_catalog:
    label: STAC Catalog
    description: |
      STAC Catalog linking to the provided collections.

      The official MIME type is application/json however, we use application/stac+json to indicate that this is a STAC catalog and differentiate from other json files.
    type: application/stac+json
conda:
  channels:
    - conda-forge
  dependencies:
    - pystac
    - jsonschema