script: script_site_optz_stepwise.R
name: Stepwise SURDES optimization with pmedians
description: Uses SURDES stepwise p-median optimization to add demand points to current monitoring sites using a supplied joint environmental and geographic distance matrix. All sites have the same condition value; custom selection conditions are not exposed.
author:
  - name: Francis van Oordt
    identifier: https://orcid.org/0000-0002-8471-235X
license: CC-BY
inputs:
  country_polygon:
    label: Study-area polygon
    description: Study-area boundary used for the output map.
    type: application/geopackage+sqlite3
    example: study_area.gpkg
  iters:
    label: Algorithm Iterations
    description: "Positive integer number of demand points to add. Must not exceed the number of rows with vini = 0. For example, 40 current sites and 60 demand points allow at most 60 additions. More iterations take longer."
    type: int
    example: 30
  rasters:
    label: Environmental rasters
    description: Environmental GeoTIFFs used upstream to produce the joint matrix. Retained for pipeline compatibility; this step reads the matrix directly.
    type: image/tiff;application=geotiff[]
    example: [predictor1.tiff, predictor2.tiff]
  locations_csv:
    label: Sampling locations
    description: "Path to one CSV with lon and lat in WGS84 decimal degrees (EPSG:4326), and vini: 1 for current sites, 0 for demand points. Input coordinates always use WGS84, independently of the selected processing CRS."
    type: text/csv
    example: "/scripts/site_optz_stepwise/site_optz_stepwise_EXAMPLE_samp_loc_peru.csv"
  mdist:
    label: Joint distance matrix
    description: CSV matrix produced by the Distance matrix step by multiplying environmental and geodesic distance entries. It must be symmetric with a zero diagonal and use the same site order as the sampling CSV. This step divides entries by their maximum before SURDES, which internally caps distances at 1.
    type: text/csv
    example: mdist.csv
outputs:
  point_sel:
    label: "Selection of demand points"
    description: "CSV of newly selected demand points in selection order, including lon, lat, vini, site_row (original CSV row, starting at 1), selected, selection_order, and status. Current sites are excluded."
    type: text/csv
  uncov:
    label: "Uncovered variability"
    description: "CSV with iteration and uncovered_variability, calculated as the sum of SURDES p-median scores at each iteration. This diagnostic is not a percentage of biodiversity represented and is not guaranteed to decrease monotonically."
    type: text/csv
  surdes_uncov:
    label: "Uncovered variability plot"
    description: "PNG showing the sum of SURDES p-median scores at each iteration. Inspect alongside the selected sites; this diagnostic is not a percentage of biodiversity represented."
    type: image/png
  surdes_map:
    label: "Map for selected points"
    description: "PNG showing current sites, unselected demand points, and selected demand points in different colours."
    type: image/png
  sites_gpkg:
    label: "Sampling sites GeoPackage"
    description: "GeoPackage containing all input sites in WGS84 with vini, site_row, selected, selection_order, and status (Current, Demand, or Selected). Use status for viewer styling; automatic colours depend on the viewer."
    type: application/geopackage+sqlite3
conda:
  channels:
    - conda-forge
    - r
  dependencies:
    - r-rjson
    - r-terra
    - r-tidyterra
    - r-ggplot2
    - r-dplyr

references:
  - text: "Medina et al. (2013). Designing bryophyte surveys for an optimal coverage of diversity gradients."
    link: https://doi.org/10.1007/s10531-013-0574-5
