script: summarise_ias.R
name: Summarise IAS data
description: "Summarise national checklist species when supplied, otherwise GRIIS-linked taxa flagged invasive anywhere, alongside annual GBIF observation counts."
author:
  - name: Saxbee Affleck
  - name: Samara Manzin
    email: samara.manzin@mcgill.ca
inputs:
  merged_dataset:
    label: Merged IAS dataset
    type: text/csv
    description: Merged IAS dataset produced by the SInAS merge-datasets step.
    example: NULL
  gbif_country_observations:
    label: GBIF country observations
    type: text/csv
    description: CSV containing GBIF occurrence counts per year for the selected country.
    example: NULL
outputs:
  ias_summary:
    label: IAS summary
    description: Summary statistics for national checklist members (nationalChecklist column), or GRIIS-linked taxa flagged invasive anywhere (isInvasiveAnywhere column). National membership does not imply confirmed invasive status.
    type: text/csv
    example: NULL
  ias_annual_summary:
    label: IAS annual summary
    description: Annual GBIF occurrence counts and first-record counts for national checklist members when supplied, otherwise GRIIS-linked taxa flagged invasive anywhere. Uses the final years selected by the merge step.
    type: text/csv
    example: NULL
  ias_summary_table:
    label: IAS summary table
    description: HTML summary table labelled with the active national-checklist or GRIIS invasive-anywhere scope.
    type: text/html
    example: NULL
conda:
  channels:
    - conda-forge
    - r
  dependencies:
    - r-dplyr
    - r-gt
    - r-readr
    - r-stringr
    - r-tibble
    - r-tidyr
    - r-rjson
